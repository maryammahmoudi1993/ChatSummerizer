[project]
name = "chat-summarizer"
version = "1.1.0"
description = "Chat storage, sentiment analysis, topic classification and summaries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
llm = ["openai>=1.30"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["chat_summarizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["chat_summarizer"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
